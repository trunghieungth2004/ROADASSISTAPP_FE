name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unlock secrets or stub config for gates
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          if [ -n "$GIT_CRYPT_KEY" ]; then
            sudo apt-get install -y git-crypt
            echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/git-crypt-key
            git crypt unlock /tmp/git-crypt-key
            rm /tmp/git-crypt-key
          else
            cat > src/config/appConfig.json <<'EOF'
          {
            "firebase": {"apiKey": "", "authDomain": "", "projectId": ""},
            "apiBaseUrl": "/api",
            "authEmulatorUrl": "",
            "maptilerKey": ""
          }
          EOF
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
